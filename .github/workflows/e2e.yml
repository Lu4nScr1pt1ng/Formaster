name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite (via WXT) requires ^20.19.0 || >=22.12.0 — see README's
          # "Build from source" for why.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run check

      # Chromium only — this suite doesn't have a Firefox project (see
      # playwright.config.ts's header comment for why).
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
